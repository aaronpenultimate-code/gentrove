<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile — Gentrove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Syne:wght@500&display=swap" rel="stylesheet">
<style>
:root{--blue:#1A4BF5;--paper:#F7F6F2;--ink:#171717;--stone:#73716C;--surface:#EEECE6;--line:#E2DFD7;--white:#fff;--red:#B4381F;
--shadow:0 1px 2px rgba(23,23,23,.05),0 4px 14px rgba(26,75,245,.05);--shadow-h:0 2px 4px rgba(23,23,23,.06),0 10px 24px rgba(26,75,245,.07);--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;padding-bottom:80px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.display{font-family:'Syne',sans-serif;font-weight:500;letter-spacing:-.02em}
.nav{position:sticky;top:0;z-index:30;background:rgba(247,246,242,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.nav-in{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.logo{font-family:'Syne',sans-serif;font-weight:500;font-size:20px;letter-spacing:-.03em}.logo span{color:var(--blue)}
.links{display:none;gap:22px;font-size:14px;color:var(--stone)}.links a:hover{color:var(--ink)}
.nav-r{display:flex;align-items:center;gap:4px;margin-left:auto}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--stone)}.icon-btn:hover{background:var(--surface);color:var(--ink)}
.btn{height:40px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--white);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.p:hover{background:#153ccc}.btn.dp{background:var(--red);border-color:var(--red);color:#fff}
.nb{display:none}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px}

/* HEADER */
.banner{position:relative;height:150px;border-radius:0 0 20px 20px;overflow:hidden;margin:0 -20px}
.banner .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.banner .chg{position:absolute;right:14px;bottom:12px;height:34px;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.94);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.who{display:flex;gap:16px;align-items:flex-end;margin-top:-44px;position:relative;flex-wrap:wrap}
.av{width:96px;height:96px;border-radius:50%;border:4px solid var(--paper);background:var(--blue);color:#fff;display:grid;place-items:center;font-family:'Syne',sans-serif;font-size:32px;overflow:hidden;flex-shrink:0;box-shadow:var(--shadow)}
.av img{width:100%;height:100%;object-fit:cover}
.who-act{margin-left:auto;display:flex;gap:8px;padding-bottom:6px}
.info{padding:14px 0 6px}
.info h1{font-size:26px;line-height:1.15}
.handle{color:var(--stone);font-size:14px}
.bio{max-width:620px;margin-top:10px;font-size:15px}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--stone);font-size:13px;margin-top:10px}
.meta span{display:inline-flex;gap:5px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:18px 0 6px;max-width:620px}
.stats div{background:var(--paper);padding:10px 12px}.stats b{display:block;font-family:'Syne',sans-serif;font-weight:500;font-size:20px;line-height:1.2}.stats span{font-size:12px;color:var(--stone)}

/* TABS */
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-top:22px}
.tab{padding:12px 0;font-size:14.5px;color:var(--stone);position:relative;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}.tab[aria-selected=true]{color:var(--ink);font-weight:500}
.tab[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--blue)}
.tab small{font-size:12px;padding:0 7px;border-radius:100px;background:var(--surface);color:var(--stone);font-weight:400}
.panel{padding:20px 0 40px}

/* PROMPTS */
.bar{display:flex;gap:10px;margin-bottom:20px}
.bar .s{position:relative;flex:1;max-width:420px}.bar .s svg{position:absolute;left:12px;top:11px;color:var(--stone)}
.bar input{width:100%;height:40px;border-radius:10px;border:1px solid transparent;background:var(--surface);padding:0 14px 0 38px;font:inherit;font-size:14px}
.bar input:focus{outline:none;border-color:var(--blue);background:var(--white)}
select{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--white);padding:0 10px;font:inherit;font-size:13px;color:var(--ink)}
.grid{columns:2;column-gap:14px}
.card{position:relative;break-inside:avoid;margin-bottom:18px;background:var(--white);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;opacity:0;transform:translateY(14px);transition:opacity .42s var(--ease),transform .42s var(--ease),box-shadow .2s}
.card.in{opacity:1;transform:none}.card.in:hover{transform:translateY(-4px);box-shadow:var(--shadow-h);transition:transform .2s ease-out,box-shadow .2s ease-out}
.media{position:relative;overflow:hidden;cursor:pointer;display:block;width:100%}.media .art{position:absolute;inset:0;transition:transform .2s ease-out}.card:hover .art{transform:scale(1.02)}
.tt{position:absolute;left:10px;top:10px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;background:rgba(23,23,23,.62);color:#fff}
.oa{position:absolute;top:10px;right:10px;z-index:2;display:flex;gap:6px;opacity:0;transition:opacity .2s}
.card:hover .oa,.oa:focus-within{opacity:1}
@media(hover:none){.oa{opacity:1}}
.oa button{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--ink)}.oa button:hover{color:var(--blue)}.oa button.dl:hover{color:var(--red)}
.body{padding:12px 14px 14px}
.title{font-family:'Syne',sans-serif;font-weight:500;font-size:16px;line-height:1.25;letter-spacing:-.01em;cursor:pointer}
.cm{font-size:12px;color:var(--stone);margin-top:3px}
.preview{font-size:13px;color:var(--stone);margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.55}
.foot{display:flex;gap:12px;margin-top:12px;font-size:12px;color:var(--stone)}.foot b{color:var(--ink);font-weight:500}

/* COLLECTIONS */
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.cc{display:block}
.mos{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:3px;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);transition:box-shadow .2s ease-out,transform .2s ease-out}
.cc:hover .mos{box-shadow:var(--shadow-h);transform:translateY(-4px)}
.mos i{background:var(--surface);display:block}.mos i:first-child{grid-row:span 2}
.cc h3{font-family:'Syne',sans-serif;font-weight:500;font-size:16px;margin-top:10px;line-height:1.25}
.cc small{color:var(--stone);font-size:12.5px;display:flex;gap:6px;align-items:center}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.sec-h h2{font-size:20px}.sec-h a{font-size:13px;color:var(--blue)}

/* ACTIVITY */
.act-grid{display:grid;gap:28px}
.box{background:var(--white);border-radius:16px;box-shadow:var(--shadow);padding:18px}
.box h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);font-weight:500;margin-bottom:14px}
.tool-row{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:13.5px;margin-bottom:10px}
.tool-row .tr{height:8px;border-radius:100px;background:var(--surface);overflow:hidden}
.tool-row i{display:block;height:100%;width:0;background:var(--blue);border-radius:100px;transition:width .9s var(--ease)}
.tool-row span:last-child{text-align:right;color:var(--stone);font-size:12.5px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.mini div{background:var(--paper);border-radius:12px;padding:10px 12px}.mini b{display:block;font-family:'Syne',sans-serif;font-weight:500;font-size:20px;line-height:1.2}.mini span{font-size:12px;color:var(--stone)}
.tl h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);font-weight:500;margin:20px 0 6px}.tl h4:first-child{margin-top:0}
.ev{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev .ic{width:34px;height:34px;border-radius:50%;background:var(--surface);color:var(--stone);display:grid;place-items:center;flex-shrink:0}
.ev .ic.b{background:#E8F0FF;color:var(--blue)}
.ev p{line-height:1.5}.ev small{display:block;color:var(--stone);font-size:12px;margin-top:2px}.ev a:hover{color:var(--blue)}
.empty{text-align:center;padding:60px 20px}.empty h3{font-size:22px;margin-bottom:6px}.empty p{color:var(--stone);font-size:14px;margin-bottom:18px}

/* MODAL + TOAST */
.ov{position:fixed;inset:0;z-index:50;background:rgba(23,23,23,.5);display:none;align-items:flex-end;justify-content:center}.ov.open{display:flex}
.md{background:var(--paper);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:22px 20px max(22px,env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.md h2{font-size:22px;margin-bottom:4px}.md .sub{color:var(--stone);font-size:14px;margin-bottom:16px}
.fl{margin-bottom:14px}.fl>label,.fl .l{display:block;font-size:13px;font-weight:500;margin-bottom:5px}.fl small{font-weight:400;color:var(--stone)}
.md input[type=text],.md textarea{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--white);padding:0 12px;font:inherit;font-size:14.5px;color:var(--ink)}
.md textarea{height:auto;padding:10px 12px;resize:vertical}
.md input:focus,.md textarea:focus{outline:none;border-color:var(--blue)}
[aria-invalid=true]{border-color:var(--red)!important}
.er{color:var(--red);font-size:12.5px;margin-top:4px}
.hint{font-size:12px;color:var(--stone);margin-top:4px}
.mb{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.ph{display:flex;align-items:center;gap:14px}.ph .av{width:64px;height:64px;font-size:22px}
.pres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pres button{height:56px;border-radius:12px;border:2px solid transparent}.pres button[aria-pressed=true]{border-color:var(--blue)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;font-size:13px;padding:9px 14px;border-radius:10px;z-index:60;opacity:0;pointer-events:none;transition:all .2s;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}.toast button{color:#9DB6FF;font-weight:500}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.tabbar a{display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--stone);gap:1px;padding:4px 10px}.tabbar a.on{color:var(--blue)}
[hidden]{display:none!important}
@media(min-width:700px){.grid{columns:3}.cgrid{grid-template-columns:repeat(3,1fr)}.ov{align-items:center}.md{border-radius:18px}.banner{height:200px}.mini{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.grid{columns:4;column-gap:18px}.cgrid{grid-template-columns:repeat(4,1fr);gap:22px}.links{display:flex}.nb{display:inline-flex}.tabbar{display:none}body{padding-bottom:40px}.toast{bottom:24px}.banner{height:230px;border-radius:0 0 24px 24px}.info h1{font-size:32px}.av{width:120px;height:120px;font-size:40px}.who{margin-top:-60px}.act-grid{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start}}
@media(min-width:1280px){.grid{columns:5}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.card{opacity:1;transform:none}}
</style>
</head>

<script>

const OUTPUTS=["Marketing & Copywriting","Coding & Automation","Data Analytics","Education","3D & Game Design","Audio & Music","UI/UX & Web Design"];

["Sunday service flyer, gold on black","Church / Faith","Nano Banana","Grace O.",2140,540,4,5,"c2","Design a bold church event flyer, 4:5. Headline '[EVENT NAME]' in large serif, gold foil texture on deep black, subtle light rays behind a silhouette of raised hands. Include date '[DATE]', venue '[VENUE]', clean grid, generous spacing.",["flyer","gold","service"]],

["Bridal editorial, ivory and sage","Events & Weddings","Midjourney","Zainab M.",1490,360,2,3,"c6","Editorial bridal portrait in a walled garden, ivory silk gown, sage green florals, backlit late afternoon sun, film grain, Kodak Portra 400 --ar 2:3",["bridal","garden","film"]],
["Weekly sales report analyst","Data Analytics","Claude","Ibrahim S.",640,175,2,1,"c7","You are a senior retail analyst. Given the pasted sales CSV, summarise revenue by week, flag the three biggest movers with likely causes, and finish with two recommended actions. Keep it under 200 words and use a table for numbers.",["report","csv","retail"]],

["Low-poly farm diorama","3D & Game Design","Nano Banana","Yusuf L.",412,88,1,1,"c12","Isometric low-poly farm diorama with a red barn, maize rows and a small tractor, soft pastel palette, clean shadows, game-asset style, neutral background.",["isometric","lowpoly"]],
["Launch week email sequence","Marketing & Copywriting","ChatGPT","Bisi A.",1560,402,2,1,"c13","Write a 5-email launch sequence for [PRODUCT] targeting [AUDIENCE]. Each email: subject line, 90-word body, one CTA. Tone: confident and warm, no hype words. Add a one-line purpose note above each email.",["email","launch"]],

/* ---------- tabs ---------- */
function showTab(t,push){
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.tab===t;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1});
  ['prompts','collections','activity'].forEach(k=>$('#p-'+k).hidden=k!==t);
  ({prompts:renderPrompts,collections:renderCols,activity:renderAct})[t]();
  if(push){try{history.replaceState(null,'','#'+t)}catch(e){}}
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)showTab(b.dataset.tab,true)});
$('#tabs').addEventListener('keydown',e=>{
  const order=['prompts','collections','activity'],i=order.indexOf(tab);let n=-1;
  if(e.key==='ArrowRight')n=(i+1)%3;else if(e.key==='ArrowLeft')n=(i+2)%3;else if(e.key==='Home')n=0;else if(e.key==='End')n=2;
  if(n>=0){e.preventDefault();showTab(order[n],true);$('#t-'+order[n]).focus()}
});

/* ---------- prompts tab ---------- */
function list(){
  let l=mine();
  if(sort==='recent')l=l.slice().sort((a,b)=>OWN.indexOf(a.id)-OWN.indexOf(b.id));else if(sort==='copies')l.sort((a,b)=>b.copies-a.copies);else l.sort((a,b)=>b.likes-a.likes);
  if(q)l=l.filter(d=>(d.title+d.cat+d.tool+d.prompt+d.tags.join(' ')).toLowerCase().includes(q));
  return l;
}
function cardHTML(d){
  return `<article class="card"><div class="oa"><button data-edit="${d.id}" aria-label="Edit ${esc(d.title)}">${svg('M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z')}</button><button class="dl" data-del="${d.id}" aria-label="Delete ${esc(d.title)}">${svg('M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3')}</button></div>
  <div class="media" data-go="${d.id}" style="aspect-ratio:${d.w}/${d.h}" role="link" tabindex="0" aria-label="Open ${esc(d.title)}"><div class="art" style="background:${bg(d)}"></div><span class="tt">${d.tool}</span></div>

}
function gridHTML(){
  const all=mine(),l=list();

  if(!l.length)return `<div class="empty"><h3 class="display">No matches</h3><p>None of your prompts match "${esc(q)}".</p><button class="btn" data-clear>Clear search</button></div>`;
  return `<div class="grid">${l.map(cardHTML).join('')}</div>`;
}

/* ---------- modals ---------- */
function showModal(html,focus){lastFocus=document.activeElement;$('#md').innerHTML=html;$('#ov').classList.add('open');document.body.style.overflow='hidden';const f=focus&&$('#md '+focus);(f||$('#md button, #md input')).focus()}
function closeModal(){$('#ov').classList.remove('open');document.body.style.overflow='';$('#md').innerHTML='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('keydown',e=>{
  if(!$('#ov').classList.contains('open'))return;
  if(e.key==='Escape')return closeModal();
  if(e.key==='Tab'){const f=[...$('#md').querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled);if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
function pickImage(max,cb){
  upTarget=(f)=>{if(!/^image\/(jpeg|png|webp)$/.test(f.type))return toast('Use a JPG, PNG or WebP image');if(f.size>max*1048576)return toast(`Image is over ${max} MB`);cb(URL.createObjectURL(f))};

}
$('#fileup').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f&&upTarget)upTarget(f)};

   <div class="fl"><label for="fl">Location</label><input type="text" id="fl" maxlength="40" value="${esc(ME.loc)}"></div>
   <div class="fl"><label for="fw">Website <small>(optional)</small></label><input type="text" id="fw" maxlength="80" value="${esc(ME.web)}" placeholder="yourwebsite.com"><div class="er" id="e-fw"></div></div>
   <div class="mb"><button class="btn" id="cx">Cancel</button><button class="btn p" id="ok">Save changes</button></div>`,'#fn');
  let av=ME.avatar;
  $('#mph').onclick=()=>pickImage(4,u=>{av=u;$('#mav').innerHTML=`<img src="${u}" alt="">`});
  $('#fb').oninput=e=>$('#bc').textContent=e.target.value.length;
  $('#cx').onclick=closeModal;
  const bad=(id,inp,msg)=>{$('#'+id).textContent=msg;$('#'+inp).setAttribute('aria-invalid','true');return true};
  ['fn','fh','fw'].forEach(i=>$('#'+i).addEventListener('input',()=>{$('#e-'+i).textContent='';$('#'+i).removeAttribute('aria-invalid')}));
  $('#ok').onclick=()=>{
    const n=$('#fn').value.trim(),h=$('#fh').value.trim().toLowerCase(),w=$('#fw').value.trim();let e=false,first=null;
    if(n.length<2){e=bad('e-fn','fn','Enter your name (at least 2 characters).');first=first||'fn'}
    if(!/^[a-z0-9_]{3,20}$/.test(h)){e=bad('e-fh','fh','Use 3 to 20 letters, numbers or underscores.');first=first||'fh'}
    if(w&&!/^(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/\S*)?$/i.test(w)){e=bad('e-fw','fw','That does not look like a web address.');first=first||'fw'}
    if(e)return $('#'+first).focus();
    Object.assign(ME,{name:n,handle:h,bio:$('#fb').value.trim(),loc:$('#fl').value.trim(),web:w,avatar:av});
    closeModal();renderHead();toast('Profile updated');
  };
}
function editCover(){
  let sel=ME.cover.url?-1:ME.cover.i,url=ME.cover.url;
  showModal(`<h2 class="display">Change cover</h2><p class="sub">Pick a colour or upload your own image.</p>
   <div class="pres" id="pres">${COVERS.map((c,i)=>`<button aria-label="Colour ${i+1}" data-i="${i}" aria-pressed="${i===sel}" style="background:linear-gradient(120deg,${c[0]},${c[1]})"></button>`).join('')}</div>
   <div class="fl" style="margin-top:14px"><button class="btn" id="upc">Upload an image</button><div class="hint">JPG, PNG or WebP, up to 8 MB. Wide images work best.</div></div>
   <div class="mb"><button class="btn" id="cx">Cancel</button><button class="btn p" id="ok">Save cover</button></div>`);
  $('#pres').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;sel=+b.dataset.i;url=null;document.querySelectorAll('#pres button').forEach(x=>x.setAttribute('aria-pressed',x===b))};
  $('#upc').onclick=()=>pickImage(8,u=>{url=u;sel=-1;document.querySelectorAll('#pres button').forEach(x=>x.setAttribute('aria-pressed',false));toast('Image selected. Save to apply it.')});
  $('#cx').onclick=closeModal;$('#ok').onclick=()=>{ME.cover={i:Math.max(sel,0),url};closeModal();renderHead();toast('Cover updated')};
}
function editPrompt(id){
  const d=DATA[id];
  showModal(`<h2 class="display">Edit prompt</h2><p class="sub">Quick changes. Full editing with images is coming.</p>
   <div class="fl"><label for="et">Title</label><input type="text" id="et" maxlength="80" value="${esc(d.title)}"><div class="er" id="e-et"></div></div>
   <div class="fl"><label for="eg">Tags <small>(comma separated, up to 8)</small></label><input type="text" id="eg" value="${esc(d.tags.join(', '))}"><div class="er" id="e-eg"></div></div>
   <div class="mb"><button class="btn" id="cx">Cancel</button><button class="btn p" id="ok">Save</button></div>`,'#et');
  $('#cx').onclick=closeModal;
  $('#ok').onclick=()=>{
    const t=$('#et').value.trim(),tags=[...new Set($('#eg').value.split(',').map(x=>x.toLowerCase().replace(/[^a-z0-9 \-]/g,'').trim()).filter(Boolean))];
    if(t.length<5){$('#e-et').textContent='Titles need at least 5 characters.';$('#et').setAttribute('aria-invalid','true');return $('#et').focus()}
    if(!tags.length||tags.length>8){$('#e-eg').textContent=tags.length?'Use up to 8 tags.':'Add at least one tag.';$('#eg').setAttribute('aria-invalid','true');return $('#eg').focus()}
    d.title=t;d.tags=tags;closeModal();refresh();toast('Prompt updated');
  };
}
function delPrompt(id){
  const d=DATA[id];
  showModal(`<h2 class="display">Delete this prompt?</h2><p class="sub">"${esc(d.title)}" will be removed from your profile and from the feed. People who saved it lose it from their collections.</p>
   <div class="mb"><button class="btn" id="cx">Keep it</button><button class="btn dp" id="ok">Delete prompt</button></div>`,'#cx');
  $('#cx').onclick=closeModal;
  $('#ok').onclick=()=>{const i=OWN.indexOf(id);OWN.splice(i,1);closeModal();renderHead();refreshTab();toast(`Deleted "${d.title}"`,()=>{OWN.splice(i,0,id);renderHead();refreshTab()})};
}
const refreshTab=()=>{if(tab==='prompts')renderPrompts();else if(tab==='activity')renderAct()};

/* ---------- events ---------- */
$('#editp').onclick=editProfile;$('#chg').onclick=editCover;
$('#share').onclick=async()=>{const ok=await copyText(location.href.split('#')[0]);toast(ok?'Profile link copied':'Copy failed. Copy the address bar link instead.')};
document.querySelector('main').addEventListener('click',e=>{
  const g=s=>e.target.closest(s);
  const ed=g('[data-edit]');if(ed)return editPrompt(+ed.dataset.edit);
  const dl=g('[data-del]');if(dl)return delPrompt(+dl.dataset.del);
  if(g('[data-clear]')){q='';const i=$('#q');if(i)i.value='';return refresh()}
  const go=g('[data-go]');if(go)location.href='prompt-detail.html?id='+go.dataset.go;
});
document.querySelector('main').addEventListener('input',e=>{if(e.target.id==='q'){clearTimeout(refresh.t);refresh.t=setTimeout(()=>{q=e.target.value.trim().toLowerCase();refresh()},200)}});
document.querySelector('main').addEventListener('change',e=>{if(e.target.id==='sort'){sort=e.target.value;refresh()}});
document.querySelector('main').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.go)location.href='prompt-detail.html?id='+e.target.dataset.go});

/* ---------- init ---------- */
renderHead();
const h0=location.hash.slice(1);showTab(['prompts','collections','activity'].includes(h0)?h0:'prompts',false);
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['prompts','collections','activity'].includes(h)&&h!==tab)showTab(h,false)});
</script>
</body>
</html>
