<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt — Gentrove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Syne:wght@500&display=swap" rel="stylesheet">
<style>
:root{--blue:#1A4BF5;--paper:#F7F6F2;--ink:#171717;--stone:#73716C;--surface:#EEECE6;--line:#E2DFD7;--white:#fff;
--shadow:0 1px 2px rgba(23,23,23,.05),0 4px 14px rgba(26,75,245,.05);--shadow-h:0 2px 4px rgba(23,23,23,.06),0 10px 24px rgba(26,75,245,.07);--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;padding-bottom:140px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.display{font-family:'Syne',sans-serif;font-weight:500;letter-spacing:-.02em}
.nav{position:sticky;top:0;z-index:30;background:rgba(247,246,242,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.nav-in{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{font-family:'Syne',sans-serif;font-weight:500;font-size:20px;letter-spacing:-.03em}.logo span{color:var(--blue)}
.links{display:none;gap:22px;font-size:14px;color:var(--stone)}.links a:hover{color:var(--ink)}
.nav-r{display:flex;align-items:center;gap:4px;margin-left:auto}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--stone)}
.icon-btn:hover{background:var(--surface);color:var(--ink)}
.btn{height:38px;padding:0 16px;border-radius:10px;background:var(--blue);color:#fff;font-size:14px;font-weight:500;display:none;align-items:center}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--stone);padding:16px 0}.back:hover{color:var(--ink)}

/* DETAIL */
.detail{display:grid;gap:20px;padding-bottom:32px}
.hero{background:var(--white);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.hero-img{position:relative;width:100%;max-height:78vh}
.art{position:absolute;inset:0;opacity:0;transition:opacity .3s}.art.loaded{opacity:1}
.tool-tag{position:absolute;left:12px;top:12px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;background:rgba(23,23,23,.62);color:#fff}
.info h1{font-size:28px;line-height:1.15}
.by{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:14px}
.av{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:500;color:var(--stone)}
.by small{color:var(--stone);display:block;font-size:12px;line-height:1.3}
.pbox{margin-top:16px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:14.5px;line-height:1.7;white-space:pre-wrap}
.pbox mark{background:#E8F0FF;color:var(--blue);border-radius:4px;padding:0 3px}
.acts{display:flex;gap:10px;margin-top:14px}
.copy{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--white);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.copy:hover{border-color:var(--ink)}
.copy.main{flex:1;background:var(--blue);border-color:var(--blue);color:#fff}
.copy.main.done{background:var(--ink);border-color:var(--ink)}
.copy.on{color:var(--blue);border-color:var(--blue)}.copy.on svg{fill:var(--blue)}
.params{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:18px}
.params div{background:var(--paper);padding:10px 12px;font-size:13px}
.params span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--stone)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.chip{font-size:12px;padding:4px 11px;border-radius:100px;background:var(--surface);color:var(--stone)}.chip:hover{color:var(--ink)}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:24px 0 14px;border-top:1px solid var(--line)}
.sec h2{font-size:22px}.sec span{font-size:13px;color:var(--stone)}

/* GRID */
.grid{columns:2;column-gap:14px}
.card{break-inside:avoid;margin-bottom:18px;background:var(--white);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;opacity:0;transform:translateY(14px);transition:opacity .42s var(--ease),transform .42s var(--ease),box-shadow .2s}
.card.in{opacity:1;transform:none}
.card.in:hover{transform:translateY(-4px);box-shadow:var(--shadow-h);transition:transform .2s ease-out,box-shadow .2s ease-out}
.media{position:relative;overflow:hidden;cursor:pointer;display:block;width:100%}
.card:hover .art{transform:scale(1.02)}.card .art{transition:transform .2s ease-out,opacity .3s}
.body{padding:12px 14px 14px}
.title{font-family:'Syne',sans-serif;font-weight:500;font-size:16px;line-height:1.25;letter-spacing:-.01em;cursor:pointer}
.meta{font-size:12px;color:var(--stone);margin-top:3px}
.preview{font-size:13px;color:var(--stone);margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.55}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--stone)}
.foot b{color:var(--ink);font-weight:500}
.cbtn{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;transition:all .2s}
.cbtn:hover{border-color:var(--ink)}.cbtn.done{background:var(--blue);border-color:var(--blue);color:#fff}
.sk{break-inside:avoid;margin-bottom:18px;border-radius:16px;background:var(--surface);position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:sh 1.3s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.ad{break-inside:avoid;margin-bottom:18px;border:1px dashed var(--line);border-radius:16px;padding:28px 14px;text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--stone)}
#sentinel{height:1px}
.err{padding:12px 14px;border-radius:10px;background:#fff3f0;color:#a2361f;font-size:13px;margin-bottom:12px;display:none}

/* MOBILE BAR */
.mbar{position:fixed;left:0;right:0;bottom:56px;z-index:25;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px}
.mbar .copy{height:44px}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.tabbar a{display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--stone);gap:1px;padding:4px 10px}.tabbar a.on{color:var(--blue)}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:8px 14px;border-radius:10px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}

.thumbs{display:flex;gap:8px;padding:12px}
.thumb{width:60px;height:60px;border-radius:10px;overflow:hidden;border:2px solid transparent;flex-shrink:0;padding:0}.thumb.on{border-color:var(--blue)}
.stats{display:flex;gap:18px;font-size:13px;color:var(--stone);margin-top:8px;flex-wrap:wrap}.stats b{color:var(--ink);font-weight:500}
.follow{margin-left:auto;height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);font-size:13px;font-weight:500}.follow.on{background:var(--surface)}
.vars{display:grid;gap:10px}.vars label{font-size:12px;color:var(--stone);display:block;margin-bottom:2px}
.vars input,.cform input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--white);padding:0 12px;font:inherit;font-size:14px;color:var(--ink)}
.vars input:focus,.cform input:focus{outline:none;border-color:var(--blue)}
.pbox mark.f{background:#FFF3B8;color:var(--ink)}
.block{margin-top:24px}.block h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);font-weight:500;margin-bottom:10px}
.tips{list-style:none;display:grid;gap:8px}.tips li{font-size:14px;padding-left:16px;position:relative}.tips li::before{content:"";position:absolute;left:0;top:10px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.neg{font-size:13.5px;color:var(--stone);background:var(--surface);border-radius:10px;padding:10px 12px}
.cm{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.cm p{font-size:14px}.cm small{color:var(--stone);font-size:12px}
.cform{display:flex;gap:8px;margin-top:14px}.cform button{height:40px;padding:0 16px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px;font-weight:500}.cform button:disabled{opacity:.35;cursor:not-allowed}
.vars textarea{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--white);padding:10px 12px;font:inherit;font-size:14px;color:var(--ink);resize:vertical}
.vars textarea:focus{outline:none;border-color:var(--blue)}
.pbox mark.file{background:transparent;outline:1px dashed var(--blue);outline-offset:1px}
.card{position:relative}
.save-ov{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.94);display:grid;place-items:center;color:var(--ink);box-shadow:var(--shadow);opacity:0;transition:opacity .2s}
.card:hover .save-ov,.save-ov:focus-visible,.save-ov.on{opacity:1}
.save-ov.on,.copy.on{color:var(--blue)}.save-ov.on svg{fill:var(--blue)}
@media(hover:none){.save-ov{opacity:1}}
.pk-ov{position:fixed;inset:0;z-index:70;background:rgba(23,23,23,.5);display:none;align-items:flex-end;justify-content:center}.pk-ov.open{display:flex}
.pk-md{background:var(--paper);width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:22px 20px max(22px,env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.pk-md h2{font-family:'Syne',sans-serif;font-weight:500;font-size:22px;letter-spacing:-.02em}
.pk-sub{color:var(--stone);font-size:14px;margin:2px 0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-list{display:grid;gap:2px;max-height:40vh;overflow:auto;margin-bottom:10px}
.pk-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer;font-size:14px}.pk-row:hover{background:var(--surface)}
.pk-row input{accent-color:var(--blue);width:18px;height:18px}.pk-row span{flex:1}.pk-row small{color:var(--stone)}
.pk-new{display:flex;gap:8px}.pk-new input{flex:1;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--white);padding:0 12px;font:inherit;font-size:14.5px;color:var(--ink)}.pk-new input:focus{outline:none;border-color:var(--blue)}
.pk-b{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--white);font-size:14px;font-weight:500}.pk-b:hover{border-color:var(--ink)}
.pk-b.p{background:var(--blue);border-color:var(--blue);color:#fff}
.pk-er{color:#B4381F;font-size:12.5px;min-height:18px;margin-top:4px}
.pk-done{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.pk-done a{font-size:13px;color:var(--blue)}
@media(min-width:700px){.pk-ov{align-items:center}.pk-md{border-radius:18px}}
@media(min-width:700px){.grid{columns:3}}
@media(min-width:960px){
 .grid{columns:4;column-gap:18px}.links{display:flex}.btn{display:flex}.tabbar,.mbar{display:none}body{padding-bottom:40px}.toast{bottom:24px}
 .detail{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:start}
 .hero{position:sticky;top:76px}.info h1{font-size:34px}}
@media(min-width:1280px){.grid{columns:5}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.card{opacity:1;transform:none}}
</style>
</head>

/* Sample data. image:null → gradient fallback. Swap in real /images/ paths later. */
const P=[

/* Fill-in engine: finds [bracketed] placeholders in ANY category's prompt. Case-insensitive, de-duplicated, skips code-like brackets. */
const RE=/(^|[^\w)\]])(\[([^\[\]]{2,90})\])(?!\()/g;
const norm=s=>s.replace(/["'“”]/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
const isCode=c=>/[\\^*+?|{}=<>;]/.test(c)||!/[A-Za-z]{2}/.test(c)||/^\s*[a-z0-9]-[a-z0-9]/i.test(c)||/^\s*['"`].*['"`]\s*$/.test(c);
const kindOf=c=>/\b(insert|upload|attach)\b/i.test(c)&&/\b(photo|image|picture|logo|reference|file|screenshot|csv|document|pdf|data)\b/i.test(c)?'file':/\bpaste\b/i.test(c)?'long':'text';
const nice=c=>{const t=c.replace(/["“”]/g,'').replace(/\s+/g,' ').trim();return t===t.toUpperCase()?t.toLowerCase().replace(/\b\w/g,m=>m.toUpperCase()):t};
function tokens(d){
  if(d._t)return d._t;const s=d.prompt,out=[],re=new RegExp(RE.source,'g');let last=0,m;
  while((m=re.exec(s))){const c=m[3];if(isCode(c))continue;const st=m.index+m[1].length;if(st>last)out.push({p:0,s:s.slice(last,st)});out.push({p:1,s:m[2],key:norm(c),label:nice(c),kind:kindOf(c)});last=st+m[2].length}
  out.push({p:0,s:s.slice(last)});return d._t=out}
const fieldsOf=d=>{const seen={};return tokens(d).filter(t=>t.p&&!seen[t.key]&&(seen[t.key]=1))};
const filled=d=>tokens(d).map(t=>t.p&&t.kind!=='file'&&S.V[t.key]?S.V[t.key]:t.s).join('');
function promptHTML(d){return tokens(d).map(t=>!t.p?esc(t.s):t.kind==='file'?`<mark class="file">${esc(t.s)}</mark>`:S.V[t.key]?`<mark class="f">${esc(S.V[t.key])}</mark>`:`<mark>${esc(t.s)}</mark>`).join('')}
const extra=d=>{const x=Object.assign({negative:"No watermark, no extra text, no distorted details.",tips:["Replace every highlighted placeholder before you run the prompt.","Run it 3 or 4 times and keep the strongest result.","Save your favourite version to a collection so you can find it again."],model:d.tool,res:"2K",style:d.cat,posted:"2 weeks ago",comments:[["Amaka E.","Worked first try. Saving this one.","1d ago"],["Tunde A.","Great structure, I changed the palette and it still holds up.","5d ago"]]},EXTRA[d.id]||{});const v={};for(const k in (x.vars||{}))v[norm(k)]=x.vars[k];x.vars=v;return x};

function rank(cur){const c=DATA[cur];return DATA.filter(d=>d.id!==cur).map(d=>({d,s:(d.cat===c.cat?4:0)+(d.tool===c.tool?2:0)+d.tags.filter(t=>c.tags.includes(t)).length+d.copies/1e5})).sort((a,b)=>b.s-a.s).map(x=>x.d)}

function commentHTML(c){return `<div class="cm"><div class="av">${esc(c[0][0])}</div><div><small><b style="color:var(--ink);font-weight:500">${esc(c[0])}</b> · ${esc(c[2])}</small><p>${esc(c[1])}</p></div></div>`}

function renderDetail(){
  const d=DATA[S.cur],x=extra(d),fs=fieldsOf(d),tf=fs.filter(f=>f.kind!=='file'),ff=fs.filter(f=>f.kind==='file');S.V={};S.thumb=0;document.title=d.title+' — Gentrove';

    ${fs.length?`<div class="block"><h3>Fill in your details</h3>${ff.length?`<div class="neg" style="margin-bottom:10px">Attach when you run it: ${ff.map(f=>`<b>${esc(f.label)}</b>`).join(', ')}</div>`:''}<div class="vars">${tf.map((f,i)=>`<div><label for="v${i}">${esc(f.label)}</label>${f.kind==='long'?`<textarea id="v${i}" data-v="${esc(f.key)}" rows="3" placeholder="${esc(x.vars[f.key]||f.label)}"></textarea>`:`<input id="v${i}" data-v="${esc(f.key)}" placeholder="${esc(x.vars[f.key]||f.label)}">`}</div>`).join('')}</div>${tf.length?`<div class="stats" id="prog">0 of ${tf.length} filled</div>`:''}</div>`:''}

      <button class="copy ${savedIn(d.id).length?'on':''}" id="sv" data-save="${d.id}" aria-label="Save to collection"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button></div></div>
    <div class="block"><h3>Avoid</h3><div class="neg">${esc(x.negative)}</div></div>
    <div class="block"><h3>Details</h3><div class="params">${params.map(p=>`<div><span>${p[0]}</span>${esc(p[1])}</div>`).join('')}</div></div>
    <div class="block"><h3>Tips from ${esc(d.by)}</h3><ul class="tips">${x.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
    <div class="chips">${d.tags.map(t=>`<a class="chip" href="feed.html?q=${encodeURIComponent(t)}">${esc(t)}</a>`).join('')}</div>
    <div class="block"><h3>Comments (<span id="cc">${x.comments.length}</span>)</h3><div id="cms">${x.comments.map(commentHTML).join('')}</div>
      <div class="cform"><input id="cin" placeholder="Add a comment" maxlength="300" aria-label="Add a comment"><button id="cpost" disabled>Post</button></div></div>

  $('#detail .art').classList.add('loaded');
  const missing=()=>tf.filter(f=>!S.V[f.key]).length;
  const cp=async b=>{const ok=await copyText(filled(d));if(!ok)return toast('Copy failed. Select the text manually.');d.copies++;b.classList.add('done');b.querySelector('span').textContent='Copied';toast(missing()?'Copied, '+missing()+' placeholder(s) still empty':'Prompt copied');setTimeout(()=>{b.classList.remove('done');b.querySelector('span').textContent='Copy prompt'},1800)};
  const lk=()=>{d.liked=!d.liked;d.likes+=d.liked?1:-1;['#lk','#lk2'].forEach(s=>$(s).classList.toggle('on',d.liked));$('#lc').textContent=fmt(d.likes)};

  $('#fol').onclick=e=>{const b=e.currentTarget,on=b.classList.toggle('on');b.textContent=on?'Following':'Follow'};
  document.querySelectorAll('.vars input,.vars textarea').forEach(i=>i.oninput=()=>{S.V[i.dataset.v]=i.value.trim();$('#pbox').innerHTML=promptHTML(d);const pg=$('#prog');if(pg)pg.textContent=(tf.length-missing())+' of '+tf.length+' filled'});
  document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('on'));b.classList.add('on');$('#heroImg .art').style.background=bg(d,+b.dataset.th)});
  const cin=$('#cin'),cpost=$('#cpost');
  cin.oninput=()=>cpost.disabled=!cin.value.trim();
  const post=()=>{const v=cin.value.trim();if(!v)return;$('#cms').insertAdjacentHTML('afterbegin',commentHTML(['You',v,'just now']));cin.value='';cpost.disabled=true;$('#cc').textContent=$('#cms').children.length};
  cpost.onclick=post;cin.onkeydown=e=>{if(e.key==='Enter')post()};

const COLL=[{id:'c1',name:'Church & events',ids:[5,30,19,1]},{id:'c2',name:'Client work: beauty',ids:[13,28,8,32]},{id:'c3',name:'Real estate ideas',ids:[0,18]},{id:'c4',name:'Prompts to try',ids:[7,12,29,9,20,3]},{id:'c5',name:'Weekend project',ids:[]}];
let pkSeq=6,pkLast=null;
const bmSvg='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';
const savedIn=pid=>COLL.filter(c=>c.ids.includes(pid));
const saveBtn=id=>{const on=savedIn(id).length>0;return `<button class="save-ov ${on?'on':''}" data-save="${id}" aria-pressed="${on}" aria-label="${on?'Saved. Change collections':'Save to collection'}">${bmSvg}</button>`};
function syncSave(pid){document.querySelectorAll(`[data-save="${pid}"]`).forEach(b=>{const on=savedIn(pid).length>0;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',on?'Saved. Change collections':'Save to collection')})}
document.body.insertAdjacentHTML('beforeend','<div class="pk-ov" id="pkov" role="dialog" aria-modal="true" aria-label="Save to collection"><div class="pk-md" id="pkmd"></div></div>');
const pkNameErr=n=>{const t=n.trim();if(!t)return 'Give your collection a name.';if(t.length>40)return 'Keep the name under 40 characters.';if(COLL.some(c=>c.name.toLowerCase()===t.toLowerCase()))return 'You already have a collection with that name.';return ''};
function pkClose(){$('#pkov').classList.remove('open');document.body.style.overflow='';if(pkLast&&document.contains(pkLast))pkLast.focus()}
function openPicker(pid){
  const d=DATA[pid];pkLast=document.activeElement;
  const rows=()=>COLL.map(c=>`<label class="pk-row"><input type="checkbox" data-c="${c.id}" ${c.ids.includes(pid)?'checked':''}><span>${esc(c.name)}</span><small>${c.ids.length}</small></label>`).join('');
  $('#pkmd').innerHTML=`<h2>Save to collection</h2><p class="pk-sub">${esc(d.title)}</p><div class="pk-list" id="pkl">${rows()}</div>
   <div class="pk-new"><input type="text" id="pkn" maxlength="40" placeholder="New collection name" aria-label="New collection name" autocomplete="off"><button class="pk-b" id="pka">Create</button></div><div class="pk-er" id="pke"></div>
   <div class="pk-done"><a href="collections.html">View collections</a><button class="pk-b p" id="pkd">Done</button></div>`;
  $('#pkov').classList.add('open');document.body.style.overflow='hidden';$('#pkd').focus();
  $('#pkl').onchange=e=>{const cb=e.target.closest('[data-c]');if(!cb)return;const c=COLL.find(x=>x.id===cb.dataset.c);
    if(cb.checked){if(!c.ids.includes(pid))c.ids.push(pid);toast('Saved to '+c.name)}else{c.ids=c.ids.filter(i=>i!==pid);toast('Removed from '+c.name)}
    cb.closest('.pk-row').querySelector('small').textContent=c.ids.length;syncSave(pid)};
  const add=()=>{const n=$('#pkn').value,er=pkNameErr(n);if(er){$('#pke').textContent=er;return}
    COLL.push({id:'c'+(pkSeq++),name:n.trim(),ids:[pid]});$('#pkl').innerHTML=rows();$('#pkn').value='';$('#pke').textContent='';toast('Saved to '+n.trim());syncSave(pid)};
  $('#pka').onclick=add;$('#pkn').onkeydown=e=>{if(e.key==='Enter')add()};$('#pkn').oninput=()=>$('#pke').textContent='';$('#pkd').onclick=pkClose;
}
$('#pkov').addEventListener('mousedown',e=>{if(e.target.id==='pkov')pkClose()});
document.addEventListener('keydown',e=>{
  if(!$('#pkov').classList.contains('open'))return;
  if(e.key==='Escape')return pkClose();
  if(e.key==='Tab'){const f=[...$('#pkmd').querySelectorAll('button,input,a[href]')];const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});

const io=new IntersectionObserver(es=>{let n=0;es.forEach(e=>{if(e.isIntersecting){const c=e.target;io.unobserve(c);setTimeout(()=>c.classList.add('in'),Math.min(n++,8)*40)}})},{rootMargin:'0px 0px -6% 0px'});
function cardHTML(d){
  return `<article class="card">${saveBtn(d.id)}<div class="media" data-go="${d.id}" style="aspect-ratio:${d.w}/${d.h}" role="link" tabindex="0" aria-label="Open ${esc(d.title)}">${artHTML(d)}</div>
  <div class="body"><h3 class="title" data-go="${d.id}">${esc(d.title)}</h3><div class="meta">${esc(d.by)} · ${d.tool}</div>
  <p class="preview">${esc(d.prompt)}</p>
  <div class="foot"><span><b>${fmt(d.copies)}</b> copies</span><button class="cbtn" data-copy="${d.id}" aria-label="Copy prompt">${cpi.replace(/16/g,'14')}<span>Copy</span></button></div></div></article>`;
}
function loadMore(n=10){
  if(S.busy)return;S.busy=true;
  const g=$('#grid'),sk=[];
  for(let i=0;i<3;i++){const s=document.createElement('div');s.className='sk';s.style.height=(280+i*60)+'px';g.appendChild(s);sk.push(s)}
  setTimeout(()=>{
    sk.forEach(s=>s.remove());let html='';
    for(let i=0;i<n;i++){const d=S.queue[S.cursor%S.queue.length];S.cursor++;S.seq++;html+=cardHTML(d)+(S.seq%12===6?'<div class="ad">Advertisement</div>':'')}
    const t=document.createElement('div');t.innerHTML=html;
    [...t.children].forEach(el=>{g.appendChild(el);if(el.classList.contains('card')){io.observe(el);el.querySelector('.art').classList.add('loaded')}});
    S.busy=false;
  },450);
}
new IntersectionObserver(es=>{if(es[0].isIntersecting)loadMore()},{rootMargin:'900px 0px'}).observe($('#sentinel'));

function openPrompt(id,push=true){
  if(!DATA[id])return;
  S.cur=id;S.queue=rank(id);S.cursor=0;S.seq=0;
  if(push)safeHistory('pushState',{id},'','?id='+id);
  renderDetail();$('#grid').innerHTML='';$('#relNote').textContent='Related to '+DATA[id].cat;
  window.scrollTo({top:0,behavior:'smooth'});
  S.busy=false;loadMore(12);
}
$('#grid').onclick=async e=>{
  const cp=e.target.closest('[data-copy]'),go=e.target.closest('[data-go]'),sv=e.target.closest('[data-save]');
  if(sv)openPicker(+sv.dataset.save);
  else if(cp){const d=DATA[+cp.dataset.copy];if(await copyText(d.prompt)){d.copies++;cp.classList.add('done');cp.querySelector('span').textContent='Copied';toast('Prompt copied');setTimeout(()=>{cp.classList.remove('done');cp.querySelector('span').textContent='Copy'},1800)}else toast('Copy failed. Select the text manually.')}
  else if(go)openPrompt(+go.dataset.go);
};
$('#grid').onkeydown=e=>{if(e.key==='Enter'&&e.target.dataset.go)openPrompt(+e.target.dataset.go)};
window.onpopstate=e=>openPrompt(e.state&&e.state.id!=null?e.state.id:(idFromUrl()??0),false);

function idFromUrl(){const raw=new URLSearchParams(location.search).get('id')??location.hash.slice(1);const v=parseInt(raw,10);return Number.isInteger(v)&&DATA[v]?v:null}
try{
  const start=idFromUrl();
  if(start===null&&(location.search||location.hash)){const e=$('#err');e.style.display='block';e.textContent="We couldn't find that prompt, so here's a popular one instead."}
  const id=start??1;
  safeHistory('replaceState',{id},'','?id='+id);
  openPrompt(id,false);
}catch(err){const e=$('#err');e.style.display='block';e.textContent='Something went wrong loading this prompt. Please refresh.';console.error(err)}
</script>
</body>
</html>
