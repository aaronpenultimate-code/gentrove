<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feed — Gentrove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Syne:wght@500&display=swap" rel="stylesheet">
<style>
:root{--blue:#1A4BF5;--yellow:#FFD000;--paper:#F7F6F2;--ink:#171717;--stone:#73716C;--surface:#EEECE6;--line:#E2DFD7;--white:#fff;
--shadow:0 1px 2px rgba(23,23,23,.05),0 4px 14px rgba(26,75,245,.05);--shadow-h:0 2px 4px rgba(23,23,23,.06),0 10px 24px rgba(26,75,245,.07);
--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;padding-bottom:64px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.display{font-family:'Syne',sans-serif;font-weight:500;letter-spacing:-.02em}

/* NAV */
.nav{position:sticky;top:0;z-index:30;background:rgba(247,246,242,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.nav-in{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.logo{font-family:'Syne',sans-serif;font-weight:500;font-size:20px;letter-spacing:-.03em}.logo span{color:var(--blue)}
.links{display:none;gap:22px;font-size:14px;color:var(--stone)}
.links a:hover,.links a.on{color:var(--ink)}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;height:40px;border-radius:10px;border:1px solid transparent;background:var(--surface);padding:0 14px 0 40px;font:inherit;font-size:14px;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--blue);background:var(--white)}
.search svg{position:absolute;left:12px;top:11px;color:var(--stone)}
.nav-r{display:flex;align-items:center;gap:4px;margin-left:auto}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--stone);position:relative}
.icon-btn:hover{background:var(--surface);color:var(--ink)}
.dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.btn{height:38px;padding:0 16px;border-radius:10px;background:var(--blue);color:#fff;font-size:14px;font-weight:500;display:none;align-items:center;gap:6px}
.btn:hover{background:#153ccc}

/* FILTERS */
.wrap{max-width:1400px;margin:0 auto;padding:0 20px}
.head{padding:28px 0 14px}
.head h1{font-size:28px;line-height:1.15}
.head p{color:var(--stone);font-size:14px;margin-top:4px}
.bar{display:flex;gap:10px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line);position:relative}
.cat-btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--white);font-size:14px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.cat-btn[aria-expanded=true]{border-color:var(--ink)}
.tools{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
.tools::-webkit-scrollbar{display:none}
.tool{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--stone);white-space:nowrap;flex-shrink:0}
.tool:hover{color:var(--ink);background:var(--surface)}
.tool.on{color:var(--ink);background:var(--surface);box-shadow:inset 0 -2px 0 var(--blue)}
.sort{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--white);padding:0 10px;font:inherit;font-size:13px;color:var(--ink);flex-shrink:0}
.menu{position:absolute;top:44px;left:0;z-index:20;width:min(560px,calc(100vw - 40px));background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-h);padding:16px;max-height:60vh;overflow:auto;display:none}
.menu.open{display:block}
.menu h4{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);margin:10px 0 6px}
.menu h4:first-child{margin-top:0}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px}
.menu-grid button{text-align:left;padding:6px 8px;border-radius:8px;font-size:13.5px}
.menu-grid button:hover{background:var(--surface)}
.menu-grid button.on{color:var(--blue);font-weight:500}
.status{font-size:13px;color:var(--stone);padding:12px 0}

/* MASONRY */
.grid{columns:2;column-gap:14px;padding-bottom:40px}
.card{break-inside:avoid;margin-bottom:18px;background:var(--white);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;opacity:0;transform:translateY(14px);transition:opacity .42s var(--ease),transform .42s var(--ease),box-shadow .2s ease-out}
.card.in{opacity:1;transform:none}
.card.in:hover{transform:translateY(-4px);box-shadow:var(--shadow-h);transition:transform .2s ease-out,box-shadow .2s ease-out}
.media{position:relative;overflow:hidden;cursor:pointer;display:block;width:100%}
.media .art{position:absolute;inset:0;transition:transform .2s ease-out,opacity .3s}
.card:hover .art{transform:scale(1.02)}
.art{opacity:0}.art.loaded{opacity:1}
.tool-tag{position:absolute;left:10px;top:10px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;background:rgba(23,23,23,.62);color:#fff}
.body{padding:12px 14px 14px}
.title{font-family:'Syne',sans-serif;font-weight:500;font-size:16px;line-height:1.25;letter-spacing:-.01em;cursor:pointer}
.meta{font-size:12px;color:var(--stone);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.preview{font-size:13px;color:var(--stone);margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.55}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.stats{font-size:12px;color:var(--stone);display:flex;gap:12px;align-items:center}
.stats b{color:var(--ink);font-weight:500}
.like{display:flex;align-items:center;gap:4px;color:var(--stone)}
.like:hover,.like.on{color:var(--blue)}
.like.on svg{fill:var(--blue)}
.copy{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;transition:all .2s}
.copy:hover{border-color:var(--ink)}
.copy.done{background:var(--blue);border-color:var(--blue);color:#fff}

/* SKELETON / STATES */
.sk{break-inside:avoid;margin-bottom:18px;border-radius:16px;background:var(--surface);overflow:hidden;position:relative}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:sh 1.3s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.empty{text-align:center;padding:80px 20px;display:none}
.empty h3{font-size:22px;margin-bottom:6px}.empty p{color:var(--stone);font-size:14px;margin-bottom:16px}
.link-btn{color:var(--blue);font-weight:500;font-size:14px}
.more{display:block;margin:0 auto 48px;height:40px;padding:0 20px;border-radius:10px;border:1px solid var(--line);background:var(--white);font-size:14px}
.more:hover{border-color:var(--ink)}

/* AD ZONE */
.ad{break-inside:avoid;margin-bottom:18px;border:1px dashed var(--line);border-radius:16px;padding:28px 14px;text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--stone)}

/* MODAL */
.ov{position:fixed;inset:0;z-index:50;background:rgba(23,23,23,.5);display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.modal{background:var(--paper);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;display:grid;grid-template-columns:1fr}
.m-media{position:relative;min-height:280px}
.m-info{padding:20px}
.m-info h2{font-size:24px;line-height:1.15}
.pbox{margin-top:16px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;line-height:1.65;white-space:pre-wrap;max-height:240px;overflow:auto}
.m-actions{display:flex;gap:10px;margin-top:14px}
.m-actions .copy{flex:1;justify-content:center;height:42px;background:var(--blue);border-color:var(--blue);color:#fff}
.m-actions .copy.done{background:var(--ink);border-color:var(--ink)}
.close{position:absolute;top:12px;right:12px;z-index:2;width:36px;height:36px;border-radius:10px;background:var(--white);display:grid;place-items:center;box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:12px;padding:3px 10px;border-radius:100px;background:var(--surface);color:var(--stone)}

/* MOBILE TAB BAR */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.tabbar a{display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--stone);gap:1px;padding:4px 10px}
.tabbar a.on{color:var(--blue)}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:8px 14px;border-radius:10px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

.card{position:relative}
.save-ov{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.94);display:grid;place-items:center;color:var(--ink);box-shadow:var(--shadow);opacity:0;transition:opacity .2s}
.card:hover .save-ov,.save-ov:focus-visible,.save-ov.on{opacity:1}
.save-ov.on,.copy.on{color:var(--blue)}.save-ov.on svg{fill:var(--blue)}
@media(hover:none){.save-ov{opacity:1}}
.pk-ov{position:fixed;inset:0;z-index:70;background:rgba(23,23,23,.5);display:none;align-items:flex-end;justify-content:center}.pk-ov.open{display:flex}
.pk-md{background:var(--paper);width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:22px 20px max(22px,env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.pk-md h2{font-family:'Syne',sans-serif;font-weight:500;font-size:22px;letter-spacing:-.02em}
.pk-sub{color:var(--stone);font-size:14px;margin:2px 0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-list{display:grid;gap:2px;max-height:40vh;overflow:auto;margin-bottom:10px}
.pk-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer;font-size:14px}.pk-row:hover{background:var(--surface)}
.pk-row input{accent-color:var(--blue);width:18px;height:18px}.pk-row span{flex:1}.pk-row small{color:var(--stone)}
.pk-new{display:flex;gap:8px}.pk-new input{flex:1;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--white);padding:0 12px;font:inherit;font-size:14.5px;color:var(--ink)}.pk-new input:focus{outline:none;border-color:var(--blue)}
.pk-b{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--white);font-size:14px;font-weight:500}.pk-b:hover{border-color:var(--ink)}
.pk-b.p{background:var(--blue);border-color:var(--blue);color:#fff}
.pk-er{color:#B4381F;font-size:12.5px;min-height:18px;margin-top:4px}
.pk-done{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.pk-done a{font-size:13px;color:var(--blue)}
@media(min-width:700px){.pk-ov{align-items:center}.pk-md{border-radius:18px}}
@media(min-width:700px){.grid{columns:3}.card:hover{}
.modal{max-width:960px;border-radius:18px;grid-template-columns:1.1fr 1fr;margin:auto;max-height:88vh}.ov{align-items:center;padding:20px}.m-media{min-height:480px}}
@media(min-width:960px){.grid{columns:4;column-gap:18px}.links{display:flex}.btn{display:flex}.tabbar{display:none}body{padding-bottom:0}.head h1{font-size:34px}.toast{bottom:24px}}
@media(min-width:1280px){.grid{columns:5}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.card{opacity:1;transform:none}}
</style>
</head>

const DATA=P.map((p,i)=>({id:i,title:p[0],cat:p[1],tool:p[2],by:p[3],copies:p[4],likes:p[5],w:p[6],h:p[7],g:p[8],prompt:p[9],tags:p[10],img:null,ago:i,liked:false}));

const S={cat:null,tool:"All",q:"",sort:"copies",shown:12};
const $=s=>document.querySelector(s);
const fmt=n=>n>=1000?(n/1000).toFixed(1).replace('.0','')+'k':n;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const heart='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/></svg>';
const cpi='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const artHTML=d=>{const[a,b]=GRADS[d.g];return `<div class="art" style="background:${d.img?`url(${d.img}) center/cover`:`linear-gradient(145deg,${a},${b})`}"></div>`};

function filtered(){
  let r=DATA.filter(d=>(!S.cat||d.cat===S.cat)&&(S.tool==="All"||d.tool.startsWith(S.tool))&&(!S.q||(d.title+d.cat+d.tool+d.prompt+d.tags.join(' ')).toLowerCase().includes(S.q)));
  const k={copies:(a,b)=>b.copies-a.copies,likes:(a,b)=>b.likes-a.likes,new:(a,b)=>a.ago-b.ago}[S.sort];
  return r.sort(k);
}

function cardHTML(d){
  return `<article class="card" data-id="${d.id}">${saveBtn(d.id)}
    <div class="media" data-open="${d.id}" style="aspect-ratio:${d.w}/${d.h}" role="button" tabindex="0" aria-label="Open ${esc(d.title)}">${artHTML(d)}<span class="tool-tag">${d.tool}</span></div>
    <div class="body">
      <h3 class="title" data-open="${d.id}">${esc(d.title)}</h3>
      <div class="meta"><span>${d.by}</span><span>·</span><span>${d.cat}</span></div>
      <p class="preview">${esc(d.prompt)}</p>
      <div class="foot">
        <div class="stats"><span><b>${fmt(d.copies)}</b> copies</span><button class="like ${d.liked?'on':''}" data-like="${d.id}" aria-label="Like" aria-pressed="${d.liked}">${heart}<span>${fmt(d.likes)}</span></button></div>
        <button class="copy" data-copy="${d.id}" aria-label="Copy prompt">${cpi}<span>Copy</span></button>
      </div>
    </div></article>`;
}

let io=new IntersectionObserver(es=>{
  let n=0;es.forEach(e=>{if(e.isIntersecting){const c=e.target;io.unobserve(c);setTimeout(()=>c.classList.add('in'),Math.min(n++,8)*40)}});
},{rootMargin:'0px 0px -6% 0px'});

function render(){
  const list=filtered(),vis=list.slice(0,S.shown);
  const g=$('#grid');g.innerHTML=vis.map((d,i)=>cardHTML(d)+(i===5?'<div class="ad">Advertisement</div>':'')).join('');
  g.querySelectorAll('.card').forEach(c=>io.observe(c));
  g.querySelectorAll('.art').forEach(a=>requestAnimationFrame(()=>a.classList.add('loaded')));
  $('#empty').style.display=list.length?'none':'block';
  $('#more').style.display=list.length>S.shown?'block':'none';
  $('#status').textContent=list.length?`${list.length} prompt${list.length>1?'s':''}${S.cat?' in '+S.cat:''}`:'';
}

function skeleton(){
  const hs=[240,320,200,280,260,340,220,300];
  $('#grid').innerHTML=hs.map(h=>`<div class="sk" style="height:${h+120}px"></div>`).join('');
  $('#more').style.display='none';
}

/* filters */
function buildTools(){
  $('#tools').innerHTML=TOOLS.map(t=>`<button class="tool ${t===S.tool?'on':''}" data-tool="${t}" aria-pressed="${t===S.tool}">${t}</button>`).join('');
}
function buildMenu(){
  const b=(l)=>`<button class="${S.cat===l?'on':''}" data-cat="${l}">${l}</button>`;
  $('#menu').innerHTML=`<button class="link-btn" data-cat="" style="margin-bottom:8px">All categories</button><h4>Industries</h4><div class="menu-grid">${INDUSTRIES.map(b).join('')}</div><h4>Output type</h4><div class="menu-grid">${OUTPUTS.map(b).join('')}</div>`;
}
function setMenu(o){$('#menu').classList.toggle('open',o);$('#catBtn').setAttribute('aria-expanded',o)}
function apply(){S.shown=12;$('#catLabel').textContent=S.cat||'All categories';buildTools();buildMenu();render()}

$('#catBtn').onclick=e=>{e.stopPropagation();setMenu(!$('#menu').classList.contains('open'))};
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))setMenu(false)});
$('#menu').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;S.cat=b.dataset.cat||null;setMenu(false);apply()};
$('#tools').onclick=e=>{const b=e.target.closest('[data-tool]');if(!b)return;S.tool=b.dataset.tool;apply()};
$('#sort').onchange=e=>{S.sort=e.target.value;render()};
let t;$('#q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{S.q=e.target.value.trim().toLowerCase();S.shown=12;render()},250)};
$('#more').onclick=()=>{S.shown+=8;render()};
$('#reset').onclick=()=>{S.cat=null;S.tool="All";S.q="";$('#q').value="";apply()};

/* actions */
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1600)}
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);return true}catch(e){
    try{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(_){return false}}
}
async function doCopy(btn,d){
  const ok=await copyText(d.prompt);
  if(!ok){toast('Copy failed. Select the text manually.');return}
  d.copies++;btn.classList.add('done');btn.querySelector('span').textContent='Copied';toast('Prompt copied');
  setTimeout(()=>{btn.classList.remove('done');btn.querySelector('span').textContent='Copy'},1800);
  const c=btn.closest('.card');if(c)c.querySelector('.stats b').textContent=fmt(d.copies);
}
function toggleLike(id,btn){
  const d=DATA[id];d.liked=!d.liked;d.likes+=d.liked?1:-1;
  document.querySelectorAll(`[data-like="${id}"]`).forEach(b=>{b.classList.toggle('on',d.liked);b.setAttribute('aria-pressed',d.liked);b.querySelector('span').textContent=fmt(d.likes)});
}
$('#grid').onclick=e=>{
  const cp=e.target.closest('[data-copy]'),lk=e.target.closest('[data-like]'),op=e.target.closest('[data-open]'),sv=e.target.closest('[data-save]');
  if(sv)openPicker(+sv.dataset.save);else if(cp)doCopy(cp,DATA[+cp.dataset.copy]);else if(lk)toggleLike(+lk.dataset.like);else if(op)location.href='prompt-detail.html?id='+op.dataset.open;
};
$('#grid').onkeydown=e=>{if(e.key==='Enter'&&e.target.dataset.open)location.href='prompt-detail.html?id='+e.target.dataset.open};

/* modal */
let last;
function openModal(id){
  const d=DATA[id];last=document.activeElement;
  $('#modal').innerHTML=`<div class="m-media" style="min-height:0;aspect-ratio:${d.w}/${d.h};max-height:70vh">${artHTML(d)}<button class="close" aria-label="Close" id="x"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="m-info"><div class="meta" style="margin:0 0 6px"><span>${d.tool}</span><span>·</span><span>${d.cat}</span></div>
  <h2 class="display">${esc(d.title)}</h2><div class="meta">by ${d.by} · ${fmt(d.copies)} copies · ${fmt(d.likes)} likes</div>
  <div class="pbox" tabindex="0">${esc(d.prompt)}</div>
  <div class="chips">${d.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div>
  <div class="m-actions"><button class="copy" data-copy="${d.id}">${cpi}<span>Copy prompt</span></button><button class="copy like ${d.liked?'on':''}" data-like="${d.id}" aria-label="Like" style="height:42px">${heart}<span>${fmt(d.likes)}</span></button></div></div>`;
  $('#ov').classList.add('open');document.body.style.overflow='hidden';$('#x').focus();
  $('#modal .art').classList.add('loaded');
}
function closeModal(){$('#ov').classList.remove('open');document.body.style.overflow='';if(last)last.focus()}
$('#ov').onclick=e=>{
  if(e.target.id==='ov'||e.target.closest('#x'))return closeModal();
  const cp=e.target.closest('[data-copy]'),lk=e.target.closest('[data-like]');
  if(cp){doCopy(cp,DATA[+cp.dataset.copy]);cp.querySelector('span').textContent='Copied';setTimeout(()=>cp.querySelector('span').textContent='Copy prompt',1800)}
  if(lk)toggleLike(+lk.dataset.like);
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();setMenu(false)}});

const qp=new URLSearchParams(location.search).get('q');if(qp){S.q=qp.toLowerCase();document.querySelector('#q').value=qp}
/* ---------- Save-to-collection picker (in memory; the backend will own collections later) ---------- */
const COLL=[{id:'c1',name:'Church & events',ids:[5,30,19,1]},{id:'c2',name:'Client work: beauty',ids:[13,28,8,32]},{id:'c3',name:'Real estate ideas',ids:[0,18]},{id:'c4',name:'Prompts to try',ids:[7,12,29,9,20,3]},{id:'c5',name:'Weekend project',ids:[]}];
let pkSeq=6,pkLast=null;
const bmSvg='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';
const savedIn=pid=>COLL.filter(c=>c.ids.includes(pid));
const saveBtn=id=>{const on=savedIn(id).length>0;return `<button class="save-ov ${on?'on':''}" data-save="${id}" aria-pressed="${on}" aria-label="${on?'Saved. Change collections':'Save to collection'}">${bmSvg}</button>`};
function syncSave(pid){document.querySelectorAll(`[data-save="${pid}"]`).forEach(b=>{const on=savedIn(pid).length>0;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',on?'Saved. Change collections':'Save to collection')})}
document.body.insertAdjacentHTML('beforeend','<div class="pk-ov" id="pkov" role="dialog" aria-modal="true" aria-label="Save to collection"><div class="pk-md" id="pkmd"></div></div>');
const pkNameErr=n=>{const t=n.trim();if(!t)return 'Give your collection a name.';if(t.length>40)return 'Keep the name under 40 characters.';if(COLL.some(c=>c.name.toLowerCase()===t.toLowerCase()))return 'You already have a collection with that name.';return ''};
function pkClose(){$('#pkov').classList.remove('open');document.body.style.overflow='';if(pkLast&&document.contains(pkLast))pkLast.focus()}
function openPicker(pid){
  const d=DATA[pid];pkLast=document.activeElement;
  const rows=()=>COLL.map(c=>`<label class="pk-row"><input type="checkbox" data-c="${c.id}" ${c.ids.includes(pid)?'checked':''}><span>${esc(c.name)}</span><small>${c.ids.length}</small></label>`).join('');
  $('#pkmd').innerHTML=`<h2>Save to collection</h2><p class="pk-sub">${esc(d.title)}</p><div class="pk-list" id="pkl">${rows()}</div>
   <div class="pk-new"><input type="text" id="pkn" maxlength="40" placeholder="New collection name" aria-label="New collection name" autocomplete="off"><button class="pk-b" id="pka">Create</button></div><div class="pk-er" id="pke"></div>
   <div class="pk-done"><a href="collections.html">View collections</a><button class="pk-b p" id="pkd">Done</button></div>`;
  $('#pkov').classList.add('open');document.body.style.overflow='hidden';$('#pkd').focus();
  $('#pkl').onchange=e=>{const cb=e.target.closest('[data-c]');if(!cb)return;const c=COLL.find(x=>x.id===cb.dataset.c);
    if(cb.checked){if(!c.ids.includes(pid))c.ids.push(pid);toast('Saved to '+c.name)}else{c.ids=c.ids.filter(i=>i!==pid);toast('Removed from '+c.name)}
    cb.closest('.pk-row').querySelector('small').textContent=c.ids.length;syncSave(pid)};
  const add=()=>{const n=$('#pkn').value,er=pkNameErr(n);if(er){$('#pke').textContent=er;return}
    COLL.push({id:'c'+(pkSeq++),name:n.trim(),ids:[pid]});$('#pkl').innerHTML=rows();$('#pkn').value='';$('#pke').textContent='';toast('Saved to '+n.trim());syncSave(pid)};
  $('#pka').onclick=add;$('#pkn').onkeydown=e=>{if(e.key==='Enter')add()};$('#pkn').oninput=()=>$('#pke').textContent='';$('#pkd').onclick=pkClose;
}
$('#pkov').addEventListener('mousedown',e=>{if(e.target.id==='pkov')pkClose()});
document.addEventListener('keydown',e=>{
  if(!$('#pkov').classList.contains('open'))return;
  if(e.key==='Escape')return pkClose();
  if(e.key==='Tab'){const f=[...$('#pkmd').querySelectorAll('button,input,a[href]')];const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});

/* init: skeleton then content, with error fallback */
buildTools();buildMenu();skeleton();
setTimeout(()=>{try{render()}catch(err){$('#grid').innerHTML='';$('#status').textContent='Could not load prompts. Please refresh.'}},700);
</script>
